<div class="seller-auth container d-flex justify-content-center items-center">
  <div class="signup">
    <h2 class="heading">Seller Sign Up</h2>
    <form #sellerSignUp = "ngForm" (ngSubmit)="signUp(sellerSignUp.value)"  class="comman-form">
      <input type="text" class="form-input" ngModel name="Name" id="Name" placeholder="Enter Name" />
      <input type="email" class="form-input" ngModel name="email" id="email" placeholder="Enter email" />
      <input type="Password" class="form-input" ngModel name="Password" id="Password" placeholder="Enter Password" />
      <button class="form-button">Sign up</button>
    </form>
  </div>
</div>
